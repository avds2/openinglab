name: Bug report
description: Report reproducible behavior that is incorrect or confusing.
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for helping keep OpeningLab reliable and lightweight.
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Include what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      placeholder: "1. Open…\n2. Select…\n3. Observe…"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and device
      placeholder: Firefox 128 on Android, installed PWA
    validations:
      required: true
  - type: dropdown
    id: connectivity
    attributes:
      label: Connectivity
      options:
        - Online
        - Offline
        - Switching between online and offline
        - Not relevant
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots are useful. Do not attach private progress backups unless you have inspected them.
