<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="OpeningLab — learn, practice, and master 20 major chess openings through 136 explained lines."
    />
    <meta name="theme-color" content="#10120f" id="theme-color-meta" />
    <title>OpeningLab</title>
    <link rel="icon" href="./assets/app-icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./assets/app-icon-192.png" />
    <script>
      (() => {
        let theme = "";
        try {
          theme = localStorage.getItem("openinglab-theme") || "";
        } catch {}
        const systemTheme = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        document.documentElement.dataset.theme = theme || systemTheme;
        document.documentElement.dataset.themeSource = theme ? "user" : "system";
      })();
    </script>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="modulepreload" href="./js/app.js" />
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#app">Skip to course content</a>
    <header class="site-header">
      <a class="brand" href="#home" aria-label="OpeningLab home">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 448 512" focusable="false">
            <path d="M96 48L82.7 61.3C70.7 73.3 64 89.5 64 106.5l0 132.4c0 10.7 5.3 20.7 14.2 26.6l10.6 7c14.3 9.6 32.7 10.7 48.1 3l3.2-1.6c2.6-1.3 5-2.8 7.3-4.5l49.4-37c6.6-5 15.7-5 22.3 0c10.2 7.7 9.9 23.1-.7 30.3L90.4 350C73.9 361.3 64 380 64 400l320 0 28.9-159c2.1-11.3 3.1-22.8 3.1-34.3l0-14.7C416 86 330 0 224 0L83.8 0C72.9 0 64 8.9 64 19.8c0 7.5 4.2 14.3 10.9 17.7L96 48zm24 68a20 20 0 1 1 40 0 20 20 0 1 1-40 0zM22.6 473.4c-4.2 4.2-6.6 10-6.6 16C16 501.9 26.1 512 38.6 512l370.7 0c12.5 0 22.6-10.1 22.6-22.6c0-6-2.4-11.8-6.6-16L384 432 64 432 22.6 473.4z" />
          </svg>
        </span>
        <span>Opening<span>Lab</span></span>
      </a>

      <nav class="main-nav" aria-label="Primary navigation">
        <a href="#home" data-nav="learn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5c3.1-.8 5.8-.2 8 1.8v12c-2.2-2-4.9-2.6-8-1.8v-12Zm16 0c-3.1-.8-5.8-.2-8 1.8v12c2.2-2 4.9-2.6 8-1.8v-12Z"/></svg><span>Learn</span></a>
        <a href="#practice" data-nav="practice"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="3"/><path d="M12 3.5v17M3.5 12h17M7.5 8h1m7 8h1"/></svg><span>Practice</span></a>
        <a href="#review" data-nav="review"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 7V3m0 0h-4m4 0-3.1 3.1A7 7 0 1 0 19 12M5 17v4m0 0h4m-4 0 3.1-3.1"/></svg><span>Review</span></a>
        <a href="#quiz" data-nav="quiz"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18Z"/><path d="M9.8 9a2.3 2.3 0 1 1 3.1 2.2c-.7.3-.9.8-.9 1.5M12 16.6h.01"/></svg><span>Quiz</span></a>
        <a href="#progress" data-nav="progress"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19V9m7 10V5m7 14v-7"/></svg><span>Progress</span></a>
      </nav>

      <div class="header-actions">
        <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch color theme">
          <span class="theme-icons" aria-hidden="true"><svg class="sun-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.5"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><svg class="moon-icon" viewBox="0 0 24 24"><path d="M20 15.2A8.4 8.4 0 0 1 8.8 4 8.5 8.5 0 1 0 20 15.2Z"/></svg></span><span id="theme-label">Light</span>
        </button>
        <a class="github-link" id="github-link" href="https://github.com/avds2/openinglab" target="_blank" rel="noopener noreferrer" aria-label="View OpeningLab on GitHub">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 0 0-3.16 19.49c.5.09.68-.22.68-.48v-1.69c-2.78.6-3.37-1.18-3.37-1.18-.45-1.16-1.11-1.47-1.11-1.47-.91-.62.07-.61.07-.61 1 .07 1.53 1.03 1.53 1.03.9 1.53 2.35 1.09 2.92.83.09-.65.35-1.09.64-1.34-2.22-.25-4.56-1.11-4.56-4.94 0-1.09.39-1.98 1.03-2.68-.1-.25-.45-1.27.1-2.64 0 0 .84-.27 2.75 1.02A9.56 9.56 0 0 1 12 6.7c.85 0 1.71.11 2.51.34 1.91-1.29 2.75-1.02 2.75-1.02.55 1.37.2 2.39.1 2.64.64.7 1.03 1.59 1.03 2.68 0 3.84-2.34 4.68-4.57 4.93.36.31.68.92.68 1.85v2.89c0 .27.18.58.69.48A10 10 0 0 0 12 2Z"/></svg>
          <span>GitHub</span>
        </a>
      </div>
    </header>

    <main id="app" tabindex="-1"></main>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <div id="route-announcer" class="sr-only" role="status" aria-live="polite"></div>

    <aside class="update-notice" id="pwa-update-notice" role="status" aria-live="polite" aria-labelledby="pwa-update-title" hidden>
      <div>
        <strong id="pwa-update-title">A new OpeningLab version is ready.</strong>
        <span>Your current study session is safe. Reload when you are ready to update.</span>
      </div>
      <div class="update-notice-actions">
        <button class="button button-ghost" id="pwa-update-later" type="button">Later</button>
        <button class="button" id="pwa-update-apply" type="button">Reload now</button>
      </div>
    </aside>

    <dialog id="confirm-dialog" class="dialog">
      <form method="dialog">
        <span class="dialog-icon" aria-hidden="true">↺</span>
        <h2>Reset your progress?</h2>
        <p>This clears lessons, reviews, favorites, practice, and quiz progress on this device.</p>
        <div class="dialog-actions">
          <button class="button button-ghost" value="cancel">Keep progress</button>
          <button class="button button-danger" value="confirm">Reset everything</button>
        </div>
      </form>
    </dialog>

    <script type="module" src="./js/app.js"></script>
  </body>
</html>
